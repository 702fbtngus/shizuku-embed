// Modified for OpenLock embedding; standalone behavior is retained.
plugins {
    id("idea")
}

ext.openlockEmbedded = gradle.parent != null || providers.gradleProperty('openlockEmbedded').orNull == 'true'
ext.managerApplicationId = openlockEmbedded ? 'dev.abdullah.openlock' : 'moe.shizuku.privileged.api'
ext.managerPermissionPrefix = openlockEmbedded ? 'dev.abdullah.openlock.shizuku.permission' : 'moe.shizuku.manager.permission'
ext.serverProcessName = openlockEmbedded ? 'openlock_shizuku_server' : 'shizuku_server'
ext.serverConfigName = openlockEmbedded ? 'openlock-shizuku.json' : 'shizuku.json'
allprojects {
    group = 'dev.abdullah.openlock.shizuku'
    version = '1.0'
}

idea.module {
    excludeDirs += file('out')
}

subprojects {
    plugins.withId("com.android.base") {
        android {
            compileSdk = 36
            buildToolsVersion = "36.0.0"
            ndkVersion = "29.0.13113456"
            defaultConfig {
                minSdk = 24
                targetSdk = 36
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}

apply from: 'api/manifest.gradle'
def gitCommitId = 'git rev-parse --short HEAD'.execute([], project.rootDir).text.trim()
def gitCommitCount = Integer.parseInt('git rev-list --count HEAD'.execute([], project.rootDir).text.trim())
def baseVersionName = "${api_version_major}.6.0"
ext {
    versionCode = gitCommitCount
    versionName = "${baseVersionName}.r${gitCommitCount}.${gitCommitId}"
}
