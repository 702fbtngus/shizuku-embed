// Small host for compiling and inspecting the embedded library independently
// of Flutter. Never published as an installable OpenLock build.
plugins { id 'com.android.application' }
android {
    namespace 'dev.abdullah.openlock.integrationtest'
    defaultConfig {
        applicationId 'dev.abdullah.openlock'
        versionCode 1
        versionName 'integration-test'
        ndk { abiFilters 'arm64-v8a' }
    }
    packagingOptions {
        jniLibs { useLegacyPackaging true }
        resources { excludes += ['META-INF/versions/**/OSGI-INF/MANIFEST.MF'] }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}
configurations.configureEach {
    exclude group: 'androidx.appcompat', module: 'appcompat'
}
dependencies {
    // Library compileOnly dependencies do not propagate to a shrinking host.
    compileOnly 'dev.rikka.hidden:stub:4.4.0'
    if (rootProject.findProject(':embedded') != null) {
        implementation project(':embedded')
    } else {
        implementation 'dev.abdullah.openlock.shizuku:embedded:1.0'
    }
}
