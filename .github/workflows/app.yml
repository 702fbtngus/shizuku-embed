name: Shizuku standalone baseline

on:
  workflow_dispatch:
  push:
    branches: [openlock-integration]
    paths-ignore:
      - '**/*.md'
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: shizuku-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source and nested API
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Upstream derives its development version from Git history.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          # The action default also requests the retired SDK package "tools".
          packages: platform-tools

      - name: Install upstream Android build tools
        run: |
          sdkmanager --install --channel=3 \
            'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;29.0.13113456' 'cmake;3.31.6'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile original manager and server
        run: |
          ./gradlew --no-daemon --stacktrace -Pandroid.sdk.channel=3 \
            :manager:assembleDebug 2>&1 | tee "$RUNNER_TEMP/shizuku-baseline.log"

      - name: Record source revisions and output
        run: |
          find manager/build/outputs/apk/debug -name '*.apk' -type f > "$RUNNER_TEMP/shizuku-baseline-apks.txt"
          test -s "$RUNNER_TEMP/shizuku-baseline-apks.txt"
          {
            echo '### Standalone compilation passed'
            echo "Source: $(git rev-parse HEAD)"
            echo "API: $(git -C api rev-parse HEAD)"
            echo 'The original manager and server compiled. Device behavior and OpenLock embedding are not tested by this job.'
            echo 'No APK is published: this is a compiler baseline, not an OpenLock installation build.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shizuku-baseline-diagnostics
          path: |
            ${{ runner.temp }}/shizuku-baseline.log
            ${{ runner.temp }}/shizuku-baseline-apks.txt
          if-no-files-found: ignore
          retention-days: 7

  embedded:
    name: Embedded composite host
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native toolchain
        run: |
          sdkmanager --install --channel=3 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.31.6'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the embedded UI in a composite consumer
        run: |
          ./gradlew --no-daemon --stacktrace -p integration-consumer \
            :app:assembleDebug :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/shizuku-embedded.log"
      - name: Verify the merged APK and native payload
        run: |
          python3 integration-consumer/verify_apk.py integration-host/build/outputs/apk/debug/app-debug.apk
          python3 integration-consumer/verify_apk.py integration-host/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload embedded build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shizuku-embedded-diagnostics
          path: ${{ runner.temp }}/shizuku-embedded.log
          if-no-files-found: ignore
          retention-days: 7
