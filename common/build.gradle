// Modified for host embedding; standalone behavior is retained.
plugins {
    id 'com.android.library'
}

android {
    namespace 'rikka.shizuku.common'
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        buildConfigField 'String', 'MANAGER_APPLICATION_ID', '"' + rootProject.ext.managerApplicationId + '"'
        buildConfigField 'String', 'PERMISSION_PREFIX', '"' + rootProject.ext.managerPermissionPrefix + '"'
        buildConfigField 'String', 'SERVER_PROCESS_NAME', '"' + rootProject.ext.serverProcessName + '"'
        buildConfigField 'String', 'SERVER_CONFIG_NAME', '"' + rootProject.ext.serverConfigName + '"'
        buildConfigField 'boolean', 'EMBEDDED_MANAGER', rootProject.ext.embeddedManager.toString()
    }
}

dependencies {
    compileOnly libs.hidden.stub
}
